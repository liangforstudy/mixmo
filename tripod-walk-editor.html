<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gait Workshop</title>
<style>
:root{--ink:#3a2a1c;--paper:#f4e8cf;--paper2:#ead9b6;--accent:#8a3b2a;--gold:#b8862f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
h1{font-size:22px;margin:10px 16px 2px;font-style:italic;letter-spacing:.5px}
.sub{margin:0 16px 8px;font-size:14px;opacity:.75}
html,body{height:100%;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
#top{flex:0 0 auto;display:flex;flex-direction:column;overflow:hidden;height:55%;max-height:55%;padding-bottom:8px}
#bot{flex:1 1 auto;min-height:120px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#split{flex:0 0 44px;background:#d8c39a;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);cursor:row-resize;touch-action:none;position:relative}
#split::before{content:"";position:absolute;left:50%;top:50%;width:36px;height:4px;margin:-2px 0 0 -18px;border-radius:2px;background:#7d6a52}
#split.dragging::before{background:#2f7de1}
#view{position:relative;flex:1;min-height:0;margin:0 16px;border:3px double var(--ink);border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#fbf3df,#e8d3a8);touch-action:none}
#cv{width:100%;height:100%;display:block}
#hint{position:absolute;left:10px;bottom:8px;font-size:12px;opacity:.6;pointer-events:none}
.row{display:flex;gap:8px;margin:10px 16px;flex-wrap:wrap}
button{font-family:inherit;font-size:16px;min-height:44px;min-width:44px;padding:0 14px;border:2px solid var(--ink);border-radius:10px;background:var(--paper2);color:var(--ink)}
button.on{background:var(--ink);color:var(--paper)}
.seg{display:flex;flex:1}
.seg button{flex:1;border-radius:0;margin-left:-2px}
.seg button:first-child{border-radius:10px 0 0 10px;margin-left:0}
.seg button:last-child{border-radius:0 10px 10px 0}
fieldset{margin:10px 16px;border:2px solid var(--ink);border-radius:12px;padding:6px 12px 10px;background:#f8eed8}
legend{font-style:italic;font-weight:bold;padding:0 6px}
.sl{display:grid;grid-template-columns:1fr 54px;align-items:center;column-gap:8px}
.sl label{font-size:15px;grid-column:1/3;margin-top:4px}
input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--accent);touch-action:pan-y}
.val{font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
#gait{width:100%;height:84px;display:block}
textarea{width:100%;font-size:16px;font-family:Menlo,monospace;height:120px;border:2px solid var(--ink);border-radius:10px;background:#fffaf0;color:var(--ink);padding:8px}
#msg{margin:0 16px;min-height:20px;font-size:14px;color:var(--accent)}
.lbl{font-size:15px;align-self:center}
</style>
</head>
<body>
<div id="app"><div id="top" style="padding-top:12px">
<div id="view"><canvas id="cv"></canvas><div id="hint">1 finger: orbit - 2 fingers: zoom</div></div>
</div><div id="split"></div><div id="bot">
<h1>The Curious Gait of a Three-Legged Sergal</h1>
<p class="sub">Drag to turn him about, pinch to look closer.</p>
<fieldset><legend>Show parts</legend>
<div class="sl"><label>Heads</label><input type="range" id="nHeads" min="0" max="2" step="1" value="2"><span class="val" id="nHeadsV">2</span></div>
<div class="sl"><label>Arms</label><input type="range" id="nArms" min="0" max="4" step="1" value="4"><span class="val" id="nArmsV">4</span></div>
<div class="sl"><label>Lion tails</label><input type="range" id="nTails" min="0" max="2" step="1" value="2"><span class="val" id="nTailsV">2</span></div>
</fieldset>
<fieldset id="attach"><legend>Where each leg joins the body</legend></fieldset>

<div class="row"><div class="seg" id="modes">
<button data-m="idle">Idle</button><button data-m="walk">Walk</button><button data-m="run">Run</button>
</div></div>
<div class="row">
<button id="play" class="on">Pause</button>
<button id="colors">Leg colours</button>
<button id="ground">Treadmill</button>
</div>

<fieldset><legend>Footfall chart</legend>
<canvas id="gait"></canvas>
<div class="sl"><label>Scrub cycle (when paused)</label><input type="range" id="scrub" min="0" max="1" step="0.005" value="0"><span class="val" id="scrubV">0</span></div>
<div class="sl"><label>Blend time between modes (s)</label><input type="range" id="blend" min="0" max="2" step="0.05" value="0.6"><span class="val" id="blendV">0.6</span></div>
</fieldset>

<div class="row"><span class="lbl">Editing:</span><div class="seg" id="emodes">
<button data-m="idle">Idle</button><button data-m="walk">Walk</button><button data-m="run">Run</button>
</div></div>
<div id="sliders"></div>

<fieldset><legend>Save &amp; load</legend>
<textarea id="json" spellcheck="false"></textarea>
<div class="row" style="margin:8px 0 0">
<button id="copy">Copy</button><button id="load">Apply text</button><button id="reset">Reset this mode</button>
</div>
</fieldset>
<p id="msg"></p>
<div style="height:40px"></div>
</div></div>

<script>
const META=[
 ["Timing",[["speed","Cycles per second",0,4,0.05],["travel","Ground speed",0,300,1],["phF","Tail leg phase",0,1,0.01],["phBL","Left leg phase",0,1,0.01],["phBR","Right leg phase",0,1,0.01]]],
 ["Legs",[["stride","Stride swing (deg)",0,70,1],["lift","Paw lift (deg)",0,100,1],["thigh","Thigh angle (deg)",-30,70,1],["knee","Knee bend (deg)",0,130,1],["hock","Hock bend (deg)",0,130,1],["splay","Stool splay (deg)",0,35,1]]],
 ["Body",[["bob","Bounce",0,15,0.1],["bobMul","Bounces per cycle",1,4,1],["sway","Side sway (deg)",0,15,0.5],["lean","Forward lean (deg)",-10,40,1]]],
 ["Four arms",[["armSwing","Arm swing (deg)",0,70,1],["armRaise","Arms outward (deg)",0,60,1],["elbow","Elbow bend (deg)",0,140,1]]],
 ["Two heads",[["neck","Neck spread (deg)",0,50,1],["headBob","Head nod",0,15,0.5],["headTurn","Heads glance (deg)",0,40,1]]],
 ["Lion tails",[["tailSwing","Tail swish (deg)",0,60,1],["tailLift","Tail lift (deg)",-40,60,1],["tailCurl","Tail curl (deg)",-10,30,1]]]
];
const DEF={
 idle:{speed:.35,travel:0,phF:0,phBL:.33,phBR:.67,stride:0,lift:0,thigh:18,knee:55,hock:45,splay:14,bob:1.2,bobMul:1,sway:1,lean:0,armSwing:4,armRaise:10,elbow:25,neck:22,headBob:1.5,headTurn:12,tailSwing:10,tailLift:8,tailCurl:14},
 walk:{speed:.9,travel:62,phF:0,phBL:.33,phBR:.67,stride:24,lift:32,thigh:20,knee:55,hock:45,splay:12,bob:2.5,bobMul:3,sway:3,lean:6,armSwing:20,armRaise:10,elbow:32,neck:24,headBob:3,headTurn:6,tailSwing:18,tailLift:14,tailCurl:14},
 run:{speed:1.8,travel:175,phF:0,phBL:.5,phBR:.5,stride:40,lift:55,thigh:28,knee:62,hock:52,splay:10,bob:6,bobMul:2,sway:2,lean:18,armSwing:38,armRaise:22,elbow:75,neck:28,headBob:6,headTurn:3,tailSwing:24,tailLift:30,tailCurl:8}
};
const P=JSON.parse(JSON.stringify(DEF));
let mode="walk",editMode="walk",from={...P.walk},blendU=1,cur={...P.walk};
let phase=0,playing=true,showColors=false,treadmill=false,groundOff=0;
let yaw=0.7,pitch=0.28,zoom=1;
const $=id=>document.getElementById(id);

// ---------- UI ----------
function buildSliders(){
 const host=$("sliders");host.innerHTML="";
 for(const [g,list] of META){
  const fs=document.createElement("fieldset");fs.innerHTML=`<legend>${g}</legend>`;
  for(const [k,l,mn,mx,st] of list){
   const d=document.createElement("div");d.className="sl";
   d.innerHTML=`<label>${l}</label><input type="range" min="${mn}" max="${mx}" step="${st}" value="${P[editMode][k]}"><span class="val">${P[editMode][k]}</span>`;
   const r=d.querySelector("input"),v=d.querySelector(".val");
   r.oninput=()=>{P[editMode][k]=+r.value;v.textContent=r.value;syncJSON()};
   fs.appendChild(d);
  }
  host.appendChild(fs);
 }
}
function segUI(){
 document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));
 document.querySelectorAll("#emodes button").forEach(b=>b.classList.toggle("on",b.dataset.m===editMode));
}
function syncJSON(){$("json").value=JSON.stringify(P,null,1)}
function say(t){$("msg").textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>$("msg").textContent="",3000)}
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{
 if(b.dataset.m===mode)return;from={...cur};blendU=0;mode=b.dataset.m;editMode=mode;segUI();buildSliders();
});
document.querySelectorAll("#emodes button").forEach(b=>b.onclick=()=>{editMode=b.dataset.m;segUI();buildSliders()});
$("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"Pause":"Play";$("play").classList.toggle("on",playing)};
$("colors").onclick=()=>{showColors=!showColors;$("colors").classList.toggle("on",showColors)};
$("ground").onclick=()=>{treadmill=!treadmill;$("ground").classList.toggle("on",treadmill)};
$("scrub").oninput=()=>{if(playing)$("play").onclick();phase=+$("scrub").value;$("scrubV").textContent=(+$("scrub").value).toFixed(2)};
$("blend").oninput=()=>$("blendV").textContent=$("blend").value;
$("copy").onclick=()=>{const t=$("json");t.select();
 (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>say("Copied to clipboard."),()=>{try{document.execCommand("copy");say("Copied.")}catch(e){say("Select the text and copy it manually.")}})};
$("load").onclick=()=>{try{const o=JSON.parse($("json").value);for(const m of ["idle","walk","run"])if(o[m])Object.assign(P[m],o[m]);buildSliders();say("Applied.")}catch(e){say("That text isn't valid JSON.")}};
let resetArm=0;
$("reset").onclick=()=>{const b=$("reset");
 if(!resetArm){resetArm=1;b.textContent="Tap again to reset "+editMode;b.classList.add("on");setTimeout(()=>{resetArm=0;b.textContent="Reset this mode";b.classList.remove("on")},3000);return}
 P[editMode]={...DEF[editMode]};resetArm=0;b.textContent="Reset this mode";b.classList.remove("on");buildSliders();syncJSON();say(editMode+" reset.")};

// ---------- split-pane divider ----------
(function(){
 const app=$("app"),top=$("top"),sp=$("split");
 const setPct=p=>{top.style.height=top.style.maxHeight=p+"%";resize()};
 try{const s=parseFloat(localStorage.getItem("tripodSplitPct"));if(s>=15&&s<=85)setTimeout(()=>setPct(s))}catch(e){}
 let drag=false,pct=55;
 sp.addEventListener("pointerdown",e=>{drag=true;sp.classList.add("dragging");sp.setPointerCapture(e.pointerId)});
 sp.addEventListener("pointermove",e=>{if(!drag)return;const r=app.getBoundingClientRect();
  pct=Math.max(15,Math.min(85,(e.clientY-r.top)/r.height*100));setPct(pct)});
 const end=()=>{if(!drag)return;drag=false;sp.classList.remove("dragging");try{localStorage.setItem("tripodSplitPct",pct)}catch(e){}};
 sp.addEventListener("pointerup",end);sp.addEventListener("pointercancel",end);
})();

// ---------- tap/drag anywhere on a slider track (iOS only drags the thumb natively) ----------
(function(){
 let st=null;
 const setFrom=(r,x)=>{const b=r.getBoundingClientRect(),pad=14;
  let f=Math.max(0,Math.min(1,(x-b.left-pad)/(b.width-pad*2)));
  const mn=+r.min,mx=+r.max,s=+r.step||1;
  r.value=Math.round((mn+f*(mx-mn))/s)*s;r.dispatchEvent(new Event("input",{bubbles:true}))};
 document.addEventListener("pointerdown",e=>{const r=e.target;
  if(r.tagName==="INPUT"&&r.type==="range")st={r,x:e.clientX,y:e.clientY,active:false}},true);
 document.addEventListener("pointermove",e=>{if(!st)return;
  const dx=e.clientX-st.x,dy=e.clientY-st.y;
  if(!st.active&&Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy))st.active=true;
  if(st.active)setFrom(st.r,e.clientX)},true);
 document.addEventListener("pointerup",e=>{if(!st)return;
  if(!st.active&&Math.hypot(e.clientX-st.x,e.clientY-st.y)<8)setFrom(st.r,e.clientX);st=null},true);
 document.addEventListener("pointercancel",()=>st=null,true);
})();

// ---------- touch: orbit + pinch, guarded ----------
const view=$("view"),ptrs=new Map();let gesture=null;
view.addEventListener("pointerdown",e=>{
 if(ptrs.size>=2)return; // ignore stray extra fingers
 view.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1&&!gesture)gesture="orbit";
 else if(ptrs.size===2){gesture="pinch";const[a,b]=[...ptrs.values()];gesture={d:Math.hypot(a.x-b.x,a.y-b.y),z:zoom}}
});
view.addEventListener("pointermove",e=>{
 const p=ptrs.get(e.pointerId);if(!p)return;
 if(gesture==="orbit"){yaw+=(e.clientX-p.x)*0.01;pitch=Math.max(-0.2,Math.min(1.3,pitch+(e.clientY-p.y)*0.008))}
 p.x=e.clientX;p.y=e.clientY;
 if(gesture&&gesture.d){const[a,b]=[...ptrs.values()];zoom=Math.max(.4,Math.min(3,gesture.z*Math.hypot(a.x-b.x,a.y-b.y)/gesture.d))}
});
const up=e=>{if(!ptrs.delete(e.pointerId))return;if(ptrs.size===0)gesture=null;else if(gesture&&gesture.d)gesture="done"};
view.addEventListener("pointerup",up);view.addEventListener("pointercancel",up);

// ---------- math ----------
const R=Math.PI/180;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const rotX=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return[v[0],v[1]*c-v[2]*s,v[1]*s+v[2]*c]};
const rotY=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return[v[0]*c+v[2]*s,v[1],-v[0]*s+v[2]*c]};
const rotZ=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return[v[0]*c-v[1]*s,v[0]*s+v[1]*c,v[2]]};
const frac=x=>x-Math.floor(x),ease=u=>u*u*(3-2*u);

// ---------- rig ----------
const C={fur:"#d6b483",furD:"#b8925e",belly:"#f3e2bf",tuft:"#7a4a22",ink:"#3a2a1c",ear:"#e9b9a0"};
const LEGS=[{n:"Tail leg",yaw:180,k:"phF",c:"#b5452f",tail:1},{n:"Left",yaw:60,k:"phBL",c:"#3f6f8f"},{n:"Right",yaw:300,k:"phBR",c:"#5d7f3a"}];
const SHOW={nHeads:2,nArms:4,nTails:2};
const ATT={phF:{x:0,y:0,z:-12},phBL:{x:9.5,y:0,z:5.5},phBR:{x:-9.5,y:0,z:5.5}};
(function(){const host=$("attach");
 LEGS.forEach(L=>["x","y","z"].forEach(ax=>{
  const nm={x:"side to side",y:"up / down",z:"front / back"}[ax];
  const d=document.createElement("div");d.className="sl";
  d.innerHTML=`<label>${L.n} - ${nm}</label><input type="range" min="-40" max="40" step="0.5" value="${ATT[L.k][ax]}"><span class="val">${ATT[L.k][ax]}</span>`;
  const r=d.querySelector("input"),v=d.querySelector(".val");
  r.oninput=()=>{ATT[L.k][ax]=+r.value;v.textContent=r.value};
  host.appendChild(d);
 }));
})();
["nHeads","nArms","nTails"].forEach(id=>{const r=$(id);r.oninput=()=>{SHOW[id]=+r.value;$(id+"V").textContent=r.value}});
const L1=30,L2=30,L3=22;
function legChain(p,th){
 const sw=Math.cos(th)>0?Math.cos(th):0; // >0 while paw swings forward
 const tA=(p.thigh+p.stride*Math.sin(th))*R;
 const sA=tA-(p.knee+p.lift*sw)*R;
 const mA=sA+(p.hock+p.lift*0.7*sw)*R;
 const d=a=>[0,-Math.cos(a),Math.sin(a)];
 const k=mul(d(tA),L1),h=add(k,mul(d(sA),L2)),f=add(h,mul(d(mA),L3)),t=add(f,[0,0,9]);
 return [k,h,f,t];
}
function restHeight(p){const c=legChain({...p,stride:0,lift:0},0);return -c[2][1]}

let prims=[];
const tube=(a,b,ra,rb,col,bias=0)=>prims.push({t:0,a,b,ra,rb,col,bias});
const dot=(a,r,col,bias=0)=>prims.push({t:1,a,b:a,ra:r,col,bias});

function buildRig(p,ph){
 prims=[];
 const th=2*Math.PI*ph;
 const H=restHeight(p)+p.bob*(p.bobWave*0.5+0.5);
 const P0=[0,H,0];
 const B=v=>add(P0,rotZ(rotX(v,p.lean*R),p.sway*R*Math.sin(th)));
 // legs
 for(const L of LEGS){
  const lt=th+2*Math.PI*p[L.k],y=L.yaw*R,o=[Math.sin(y),0,Math.cos(y)];
  const A=ATT[L.k],hip=add(P0,[A.x,A.y,A.z]);
  const sp=Math.tan(p.splay*R);
  const pts=legChain(p,lt).map(q=>add(hip,add(q,mul(o,-q[1]*sp))));
  const col=showColors?L.c:C.fur;
  tube(hip,pts[0],8,5.5,col);tube(pts[0],pts[1],5.5,3.6,col);tube(pts[1],pts[2],3.6,3.2,col);tube(pts[2],pts[3],4,3.4,C.furD);
  prims.push({t:2,a:[pts[2][0],0.1,pts[2][2]+4],r:9});
 }
 // torso
 tube(B([0,0,-1]),B([0,42,0]),15,12.5,C.fur);
 tube(B([0,6,6]),B([0,36,6.5]),8.5,7.5,C.belly,1);
 // arms (upper pair y38, lower pair y27)
 let armI=0;
 [[38,0],[27,Math.PI]].forEach(([sy,off])=>{
  [1,-1].forEach(side=>{
   if(armI++>=SHOW.nArms)return;
   const sh=B([side*13,sy,0]);
   const sw=p.armSwing*R*Math.sin(th+off+(side>0?Math.PI:0));
   let ud=rotX(rotZ([0,-1,0],side*p.armRaise*R),-sw);
   const el=add(sh,mul(ud,16));
   const fd=rotX(rotZ([0,-1,0],side*p.armRaise*R),-sw-p.elbow*R);
   const ha=add(el,mul(fd,15));
   tube(sh,el,5,4,C.fur);tube(el,ha,4,3.2,C.fur);dot(ha,4,C.furD);
  });
 });
 // necks + heads
 (SHOW.nHeads===1?[0]:[1,-1].slice(0,SHOW.nHeads)).forEach((side,i)=>{
  const base=B([side*4,40,0]);
  const nd=rotZ([0,1,0.15],-side*p.neck*R);
  const top=add(base,mul(nd,18));
  tube(base,top,6.5,5.5,C.fur);
  const bob=p.headBob*Math.sin(2*th+i*Math.PI);
  const hy=side*(p.headTurn*R*(0.6+0.4*Math.sin(th*0.5+i)));
  const H0=add(top,[0,bob*0.4,0]);
  const hp=v=>add(H0,rotY(rotX(v,-bob*0.03),hy));
  tube(hp([0,3,-5]),hp([0,1,21]),8.5,1.6,C.fur);       // wedge skull + snout
  tube(hp([0,-1,-2]),hp([0,-2.5,12]),5.5,1.5,C.belly,.5); // pale jaw
  [1,-1].forEach(es=>{
   tube(hp([es*3,7,-5]),hp([es*4.5,22,-9]),3.2,0.6,C.fur,-.3);
   tube(hp([es*3,8,-4.3]),hp([es*4.3,19,-7.6]),1.6,0.4,C.ear,-.2);
   dot(hp([es*4.6,5,5]),1.5,C.ink,.4);
  });
 });
 // lion tails
 (SHOW.nTails===1?[0]:[1,-1].slice(0,SHOW.nTails)).forEach((side,i)=>{
  let pt=B([side*5,10,-13]);
  for(let k=0;k<7;k++){
   const e=(p.tailLift-25+k*p.tailCurl)*R;
   const s=(side*10+p.tailSwing*Math.sin(th-k*0.55+i*0.9))*R;
   const d=[Math.sin(s)*Math.cos(e),Math.sin(e),-Math.cos(s)*Math.cos(e)];
   const np=add(pt,mul(d,7));tube(pt,np,3.6-k*0.2,3.4-k*0.2,C.fur);pt=np;
  }
  dot(pt,6.5,C.tuft);
 });
}

// ---------- render ----------
const cv=$("cv"),ctx=cv.getContext("2d");
let W,Hh,DPR;
function resize(){DPR=devicePixelRatio||1;W=cv.clientWidth;Hh=cv.clientHeight;cv.width=W*DPR;cv.height=Hh*DPR}
addEventListener("resize",resize);resize();
function proj(v){
 let q=rotX(rotY([v[0],v[1]-55,v[2]],yaw),pitch);
 const s=zoom*Math.min(W,Hh)/190*(600/(600-q[2]));
 return{x:W/2+q[0]*s,y:Hh*0.52-q[1]*s,z:q[2],s};
}
function drawGround(){
 ctx.strokeStyle="rgba(58,42,28,.18)";ctx.lineWidth=1;
 const off=((groundOff%30)+30)%30;
 for(let i=-5;i<=5;i++){
  let a=proj([i*30,0,-150]),b=proj([i*30,0,150]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  const z=i*30-off;a=proj([-150,0,z]);b=proj([150,0,z]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 }
}
function drawTube(p){
 const A=proj(p.a),Bp=proj(p.b),ra=p.ra*A.s,rb=p.ra===undefined?0:(p.t===1?ra:p.rb*Bp.s);
 ctx.beginPath();
 if(p.t===1)ctx.arc(A.x,A.y,ra,0,7);
 else{
  const ang=Math.atan2(Bp.y-A.y,Bp.x-A.x),n=ang+Math.PI/2;
  ctx.moveTo(A.x+Math.cos(n)*ra,A.y+Math.sin(n)*ra);
  ctx.lineTo(Bp.x+Math.cos(n)*rb,Bp.y+Math.sin(n)*rb);
  ctx.arc(Bp.x,Bp.y,rb,n,n-Math.PI,true);
  ctx.lineTo(A.x-Math.cos(n)*ra,A.y-Math.sin(n)*ra);
  ctx.arc(A.x,A.y,ra,n-Math.PI,n-2*Math.PI,true);
 }
 ctx.closePath();
 ctx.lineWidth=2.2;ctx.strokeStyle=C.ink;ctx.stroke();ctx.fillStyle=p.col;ctx.fill();
}
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,Hh);
 drawGround();
 for(const s of prims.filter(q=>q.t===2)){const c=proj(s.a);ctx.fillStyle="rgba(58,42,28,.15)";ctx.beginPath();ctx.ellipse(c.x,c.y,s.r*c.s,s.r*c.s*0.4,0,0,7);ctx.fill()}
 const list=prims.filter(q=>q.t!==2).map(q=>{const m=add(q.a,q.b);return{q,z:proj(mul(m,.5)).z+q.bias}}).sort((a,b)=>a.z-b.z);
 for(const o of list)drawTube(o.q);
}
function drawGait(){
 const g=$("gait"),c=g.getContext("2d"),d=devicePixelRatio||1,w=g.clientWidth,h=g.clientHeight;
 g.width=w*d;g.height=h*d;c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);
 const lx=82,rw=w-lx-4,rh=22;
 LEGS.forEach((L,i)=>{
  const y=4+i*(rh+4);c.fillStyle=C.ink;c.font="13px Georgia";c.fillText(L.n,0,y+15);
  c.fillStyle="#efe0bf";c.fillRect(lx,y,rw,rh);
  c.fillStyle=showColors?L.c:"#6b4e33";
  for(let x=0;x<rw;x++){const th=2*Math.PI*(x/rw+cur[L.k]);if(Math.cos(th)<=0)c.fillRect(lx+x,y,1,rh)}
  c.strokeStyle=C.ink;c.strokeRect(lx+.5,y+.5,rw-1,rh-1);
 });
 const px=lx+frac(phase)*rw;c.strokeStyle=C.accent||"#8a3b2a";c.strokeStyle="#8a3b2a";c.lineWidth=2;c.beginPath();c.moveTo(px,0);c.lineTo(px,h);c.stroke();
}

// ---------- loop ----------
let last=performance.now();
function frame(t){
 const dt=Math.min(.05,(t-last)/1000);last=t;
 const bt=+$("blend").value;
 blendU=bt<=0?1:Math.min(1,blendU+dt/bt);
 const u=ease(blendU),tg=P[mode];
 for(const k in tg)cur[k]=from[k]+(tg[k]-from[k])*u;
 // blend bounce waves, not the multiplier (lerping a frequency jitters)
 const th0=2*Math.PI*phase,fb=Math.sin(th0*Math.round(from.bobMul));
 cur.bobWave=fb+(Math.sin(th0*Math.round(tg.bobMul))-fb)*u;
 if(playing){phase+=dt*cur.speed;$("scrub").value=frac(phase);$("scrubV").textContent=frac(phase).toFixed(2);if(!treadmill)groundOff+=dt*cur.travel}
 buildRig(cur,phase);render();drawGait();
 requestAnimationFrame(frame);
}
segUI();buildSliders();syncJSON();requestAnimationFrame(frame);
</script>
